<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AM Verif</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f2f3ff;--mute:#8a8ca3;--acc:#8b9cff;--acc-d:#3a43a6;--card1:#1c1c25;--card2:#0d0d12}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#000;color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;display:grid;place-items:center;padding:20px;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.stage{position:relative;z-index:1;width:min(440px,100%);perspective:1100px}
.card{padding:34px 30px 30px;border-radius:22px;background:linear-gradient(145deg,var(--card1),var(--card2));border:1px solid rgba(255,255,255,.07);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -2px 0 #000,0 2px 0 #000,0 18px 30px -8px #000,0 50px 90px -10px #000,0 90px 140px #000;
 transform-style:preserve-3d;transition:transform .15s ease-out;will-change:transform}
h1{margin:0 0 6px;font-size:2.1rem;letter-spacing:-.02em;transform:translateZ(40px);
 text-shadow:1px 1px 0 #000,2px 2px 0 #000,3px 3px 0 #000,4px 4px 0 #000,5px 8px 14px #000}
.sub{margin:0 0 24px;color:var(--mute);line-height:1.5;font-size:.95rem;transform:translateZ(20px)}
label{display:block;margin:0 0 8px;font-size:.9rem;color:#c9cbe0}
input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid #000;background:#08080b;color:var(--ink);font:inherit;font-size:1rem;outline:none;
 box-shadow:inset 0 4px 10px #000,inset 0 -1px 0 rgba(255,255,255,.06),0 1px 0 rgba(255,255,255,.06)}
input:focus-visible{border-color:var(--acc);box-shadow:inset 0 4px 10px #000,0 0 0 3px rgba(139,156,255,.28)}
input:disabled{opacity:.55}
button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;font:inherit;font-weight:700;font-size:1rem;color:#0a0b1a;cursor:pointer;background:linear-gradient(180deg,#a7b4ff,var(--acc));
 box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 0 var(--acc-d),0 6px 0 1px #000,0 16px 22px #000;transition:transform .08s,box-shadow .08s}
button:active:not(:disabled){transform:translateY(5px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 0 var(--acc-d),0 1px 0 1px #000,0 6px 10px #000}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
button:disabled{opacity:.6;cursor:wait}
button.ghost{margin-top:12px;background:none;color:var(--mute);box-shadow:none;font-weight:500;padding:8px}
button.ghost:active:not(:disabled){transform:none;box-shadow:none}
.step2{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .5s ease,opacity .5s ease;margin-top:0}
.step2>div{overflow:hidden}
.step2.open{grid-template-rows:1fr;opacity:1;margin-top:22px}
.step2 .box{padding:4px 4px 6px}
.msg{min-height:1.4em;margin:16px 0 0;font-size:.92rem;line-height:1.45}
.msg.ok{color:#9be8b4}.msg.err{color:#ff9a9a}
@media (prefers-reduced-motion:reduce){.card,.step2{transition:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main class="stage" id="stage">
  <section class="card" id="card">
    <h1>AM Verif</h1>
    <p class="sub">Masukkan email, kami kirim link verifikasi. Lalu tempel link itu di kolom berikutnya.</p>

    <form id="f1" autocomplete="off">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="contoh@gmail.com" required maxlength="120" inputmode="email">
      <button id="b1" type="submit">Kirim link verifikasi</button>
    </form>

    <div class="step2" id="s2"><div><form id="f2" class="box" autocomplete="off">
      <label for="link">Periksa kode verif di email kamu, lalu tempel linknya di sini</label>
      <input id="link" type="url" placeholder="https://..." required maxlength="2000">
      <button id="b2" type="submit">Verifikasi sekarang</button>
      <button id="reset" class="ghost" type="button">Ganti email</button>
    </form></div></div>

    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </section>
</main>

<script>
// ---------- Hujan kotak kecil mengikuti grid ----------
const cv=document.getElementById('bg'),cx=cv.getContext('2d'),CELL=32,SZ=12;
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,cols,drops=[];
function size(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);cols=Math.ceil(W/CELL)}
function grid(){cx.strokeStyle='rgba(255,255,255,.04)';cx.lineWidth=1;cx.beginPath();
 for(let x=0;x<=W;x+=CELL){cx.moveTo(x+.5,0);cx.lineTo(x+.5,H)}for(let y=0;y<=H;y+=CELL){cx.moveTo(0,y+.5);cx.lineTo(W,y+.5)}cx.stroke()}
function spawn(){drops.push({c:(Math.random()*cols)|0,y:-CELL,v:.6+Math.random()*1.6,a:.25+Math.random()*.5})}
function frame(){cx.clearRect(0,0,W,H);grid();
 if(drops.length<cols*.9&&Math.random()<.5)spawn();
 for(const p of drops){p.y+=p.v;const x=p.c*CELL+(CELL-SZ)/2,y=Math.floor(p.y/CELL)*CELL+(CELL-SZ)/2;
  cx.fillStyle=`rgba(139,156,255,${p.a})`;cx.fillRect(x,y,SZ,SZ);
  cx.fillStyle=`rgba(139,156,255,${p.a*.25})`;cx.fillRect(x,y-CELL,SZ,SZ)}
 drops=drops.filter(p=>p.y<H+CELL);requestAnimationFrame(frame)}
addEventListener('resize',size);size();still?grid():frame();

// ---------- Kartu 3D mengikuti pointer ----------
const card=document.getElementById('card'),stage=document.getElementById('stage');
if(!still&&matchMedia('(hover:hover)').matches){
 stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  card.style.transform=`rotateY(${x*9}deg) rotateX(${-y*9}deg)`});
 stage.addEventListener('pointerleave',()=>card.style.transform='')}

// ---------- Alur verifikasi ----------
const $=id=>document.getElementById(id),msg=$('msg');let email='';
const say=(t,k='')=>{msg.textContent=t;msg.className='msg '+k};
async function api(path,body){
 const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.message||'Permintaan gagal, coba lagi.');return d}

$('f1').addEventListener('submit',async e=>{e.preventDefault();
 email=$('email').value.trim();$('b1').disabled=true;say('Mengirim link verifikasi...');
 try{const d=await api('/api/send',{email});say(d.message,'ok');
  $('email').disabled=true;$('b1').hidden=true;$('s2').classList.add('open');setTimeout(()=>$('link').focus(),500)}
 catch(err){say(err.message,'err')}finally{$('b1').disabled=false}});

$('f2').addEventListener('submit',async e=>{e.preventDefault();
 $('b2').disabled=true;say('Memverifikasi...');
 try{const d=await api('/api/verify',{email,link:$('link').value.trim()});say(d.message,'ok');$('link').value='';$('b2').hidden=true;$('link').disabled=true}
 catch(err){say(err.message,'err');$('b2').disabled=false}});

$('reset').addEventListener('click',()=>{email='';$('f1').reset();$('f2').reset();
 $('email').disabled=false;$('b1').hidden=false;$('link').disabled=false;$('b2').hidden=false;$('b2').disabled=false;
 $('s2').classList.remove('open');say('');$('email').focus()});
</script>
</body>
</html>
